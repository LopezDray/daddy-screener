name: Elliott pilot (นำร่อง 🌊)

# ยิงมืออย่างเดียว — ตอบคำถาม "ทั้งตลาดติดป้ายกำลังเดินคลื่นกี่ตัว" ก่อนออกแบบ UI
# $0: Yahoo ฟรี · public repo = Actions ฟรี · ไม่แตะ FMP/Supabase · read-only (ไม่ commit อะไร)
on:
  workflow_dispatch:
    inputs:
      n:
        description: 'จำนวนหุ้นที่สุ่มจาก us-all'
        required: false
        default: '300'
      seed:
        description: 'seed (คงที่ = สุ่มชุดเดิม เทียบรอบต่อรอบได้)'
        required: false
        default: '20260801'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self-test เครื่องยนต์ก่อน (ไม่แตะ net)
        run: |
          python -m screener.elliott --self-test
          python tests/test_elliott.py
      - name: นำร่อง ${{ github.event.inputs.n }} ตัว
        run: |
          python scripts/pilot_elliott.py \
            --n "${{ github.event.inputs.n }}" \
            --seed "${{ github.event.inputs.seed }}" \
            --out pilot_elliott.json
      - name: Upload ผลดิบ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-elliott
          path: pilot_elliott.json
          retention-days: 7
