name: Breakout DCA Screener

on:
  # ตลาด US ปิด → รัน 05:00 BKK (22:00 UTC) จ-ศ
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: 'จำกัดจำนวนหุ้น/universe (เว้นว่าง=ทั้งหมด) — ใช้ตอนเทส'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scan:
    strategy:
      fail-fast: false          # universe ตัวนึงพัง อีก 2 ตัวยังเดินต่อ
      matrix:
        universe: [nasdaq100, sp500, sp400, sp600]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan ${{ matrix.universe }}
        run: |
          ARGS="--universe ${{ matrix.universe }}"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python run_scan.py $ARGS
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.universe }}
          path: |
            docs/${{ matrix.universe }}.json
            docs/${{ matrix.universe }}-reversals.json
            docs/${{ matrix.universe }}-levels.json
          retention-days: 2

  # ── ทั้งตลาด US ~6-7k → shard 8 job แยก runner (แยก IP · ~850 ตัว/IP เท่าระดับ sp600) ──
  # รันพร้อม scan (คืนละครั้งหลังตลาดปิด) · แต่ละ shard เขียน bundle → merge ตอน publish
  scan_all:
    strategy:
      fail-fast: false          # shard พังตัวเดียว ตัวอื่นเดินต่อ (merge จะ skip ถ้าขาด)
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]   # 8 shard — escalate = เพิ่มที่นี่ + merge --shards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan us-all shard ${{ matrix.shard }}/8
        run: |
          ARGS="--universe us-all --shard ${{ matrix.shard }}/8 --throttle 0.35"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python run_scan.py $ARGS
      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: result-us-all-${{ matrix.shard }}
          path: docs/us-all-shard${{ matrix.shard }}.json
          retention-days: 2

  publish:
    needs: [scan, scan_all]
    if: always()               # เผยแพร่แม้บาง universe/shard fail (ใช้ของเดิมแทน)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Assemble docs/ + index.json
        run: |
          mkdir -p docs
          for u in nasdaq100 sp500 sp400 sp600; do
            f="_artifacts/result-$u/$u.json"
            if [ -f "$f" ]; then cp "$f" "docs/$u.json"; fi
            r="_artifacts/result-$u/$u-reversals.json"
            if [ -f "$r" ]; then cp "$r" "docs/$u-reversals.json"; fi
            l="_artifacts/result-$u/$u-levels.json"
            if [ -f "$l" ]; then cp "$l" "docs/$u-levels.json"; fi
          done
          # ทั้งตลาด: รวม 8 shard → us-all.json + -reversals + -levels + -table (skip ถ้า shard ไม่ครบ)
          #   #75 (09-20): SKIP = คงไฟล์เดิมไว้ = กระดานค้างวันเก่า **แบบเงียบสนิท**
          #   (run เขียว · commit "no changes" · ผู้ใช้เห็นแค่วันเดิมตัวจาง) ⇒ ต้องจับแล้วส่งเสียง
          python scripts/merge_shards.py --universe us-all --shards 8 --artifacts _artifacts | tee /tmp/merge.log
          if grep -q "SKIP us-all" /tmp/merge.log; then
            echo "us_all_skipped=1" >> "$GITHUB_ENV"
            echo "::warning::merge us-all ถูก SKIP (shard ไม่ครบ) — กระดานจะค้างของวันเดิม"
          fi
          python scripts/build_index.py
      - name: Commit & push
        run: |
          git config user.name  "daddy-screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh screener $(date -u +%FT%TZ)"
            # push แบบทนการแข่ง: ถ้ามีใครดัน main ระหว่าง scan (คน/บอต/workflow อื่น) push จะโดน reject
            # → rebase คอมมิตข้อมูลไว้บนสุดแล้วลองใหม่ (docs/ เขียนจาก scan รอบนี้ ไม่ขัดกับโค้ดที่คนแก้)
            for i in 1 2 3; do
              if git push origin HEAD:main; then echo "pushed"; exit 0; fi
              echo "push โดน reject (main ขยับ) — rebase แล้วลองใหม่ ครั้งที่ $i"
              git pull --rebase origin main || exit 1
              sleep $((i * 3))
            done
            echo "::error::push ไม่สำเร็จหลัง retry 3 ครั้ง"
            exit 1
          fi

      # 🔔 #75 (09-20): เดิมรอบสแกนพังแล้ว "เงียบทั้งสองฝั่ง" — ฝั่งเว็บเพิ่งติดป้าย ⚠️ scan เก่า >4 วัน
      #   ไปแล้ว (stage-engine.js SA_UNI_STALE_DAYS) แต่นั่นคือให้ **ผู้ใช้** เป็นคนเจอก่อนโอบ
      #   ⇒ ฝั่งนี้ต้องส่งเสียงทันทีที่รอบพัง/ถูก SKIP ไม่ใช่รอ 4 วัน
      #   ไม่มี secret (fork/PR) = ข้ามเงียบ ไม่ทำให้ job แดงเพิ่ม
      - name: 🔔 แจ้ง Telegram เมื่อรอบสแกนพังหรือถูกข้าม
        if: always() && (failure() || env.us_all_skipped == '1')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "ไม่มี secret Telegram — ข้าม"; exit 0
          fi
          if [ "${us_all_skipped:-}" = "1" ]; then
            MSG="⚠️ daddy-screener: merge us-all ถูก SKIP (shard ไม่ครบ)%0Aกระดาน Universe จะค้างของวันเดิม — ผู้ใช้เห็นวันเก่าโดยไม่มี error%0A${RUN_URL}"
          else
            MSG="🔴 daddy-screener: รอบสแกนพัง%0AUniverse จะไม่มีข้อมูลใหม่คืนนี้%0A${RUN_URL}"
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null || echo "ส่ง Telegram ไม่สำเร็จ (ไม่ทำให้ job แดง)"
